<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bellefair&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/styles.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon-32x32.png"
    />

    <script src="./js/index.js" type="module"></script>

    <title>Frontend Mentor | Space tourism website</title>
  </head>
  <body data-crew>
    <header class="section section--header">
      <div class="container">
        <nav id="nav" class="navigation fg-white tp-8" data-open="false">
          <img src="./assets/shared/logo.svg" alt="" class="navigation__logo" />
          <div class="navigation__decor"></div>
          <ul
            id="navList"
            class="navigation__list list list--col-mobile uppercase"
            aria-hidden="true"
            inert
          >
            <li class="nav__item underline-indicator">
              <a href="/index.html"><span aria-hidden="true">00</span> Home</a>
            </li>
            <li class="nav__item underline-indicator">
              <a href="/destination.html"
                ><span aria-hidden="true">01</span> Destination</a
              >
            </li>
            <li class="nav__item underline-indicator" data-selected>
              <a href="#"><span aria-hidden="true">02</span> Crew</a>
            </li>
            <li class="nav__item underline-indicator">
              <a href="/technology.html"
                ><span aria-hidden="true">03</span> Technology</a
              >
            </li>
          </ul>
          <button
            id="btnMenu"
            class="navigation__btn btn"
            type="button"
            aria-label="Toggle navigation menu"
            aria-expanded="false"
          >
            <img
              class="btn__img btn__img--close"
              src="./assets/shared/icon-close.svg"
              alt="Icon close"
            />
            <img
              class="btn__img btn__img--hamburger"
              src="./assets/shared/icon-hamburger.svg"
              alt="Icon open"
            />
          </button>
        </nav>
      </div>
    </header>
    <main class="content">
      <section class="section section--first">
        <div
          class="container flow-content flow-content--9 flow-content--13-desktopREMOVED push-inside-desktop"
        >
          <h1 class="title tp-5 fg-white"><span>02</span> Meet your crew</h1>
          <div class="crew container-internal">
            <div
              class="crew__info flow-content column column--center column--start-desktop"
            >
              <span
                id="crewRole"
                class="crew__subtitle tp-4 fg-white transparent"
                >Commander</span
              >
              <h2 id="crewTitle" class="crew__title fg-white tp-3">
                Douglas Hurley
              </h2>
              <p id="crewBio" class="crew__text fg-accent tp-9">
                Douglas Gerald Hurley is an American engineer, former Marine
                Corps pilot and former NASA astronaut. He launched into space
                for the third time as commander of Crew Dragon Demo-2.
              </p>

              <ul
                id="dotsList"
                class="dots list carousel__btns uppercase fg-accent tp-8"
                aria-hidden="true"
              >
                <li
                  class="dot__item carousel__btn"
                  data-index="0"
                  data-selected
                >
                  <button class="dot__btn" type="button"></button>
                </li>
                <li class="dot__item carousel__btn" data-index="1">
                  <button class="dot__btn" type="button"></button>
                </li>
                <li class="dot__item carousel__btn" data-index="2">
                  <button class="dot__btn" type="button"></button>
                </li>
                <li class="dot__item carousel__btn" data-index="3">
                  <button class="dot__btn" type="button"></button>
                </li>
              </ul>
            </div>

            <div class="crew__img center carousel">
              <img
                class="img-crew carousel__item"
                data-index="0"
                src="./assets/crew/image-douglas-hurley.webp"
                alt="Douglas Hurley"
              />
              <img
                class="img-crew carousel__item"
                data-index="1"
                src="./assets/crew/image-mark-shuttleworth.webp"
                alt="Mark Shuttleworth"
              />
              <img
                class="img-crew carousel__item"
                data-index="2"
                src="./assets/crew/image-victor-glover.webp"
                alt="Victor Glover"
              />
              <img
                class="img-crew carousel__item"
                data-index="3"
                src="./assets/crew/image-anousheh-ansari.webp"
                alt="Anousheh Ansari"
              />
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
